name: photonator
channels:
  - conda-forge
  - nvidia
  - defaults

dependencies:
  - python=3.11
  - numpy>=1.24
  - scipy>=1.10
  - h5py>=3.8
  - pytest>=7.0
  - ruff
  - mypy
  - pip
  - pip:
      - -e .

# GPU extras (optional — comment out if no CUDA GPU is available)

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photonator"
version = "2.1.0"
description = "Monte Carlo photon transport simulator for scattering/absorbing liquids"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
]

[project.optional-dependencies]
gpu = [
    "numba>=0.57",
    "cupy-cuda12x",
]
dev = [
    "pytest>=7.0",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["photonator*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
# Physics notation: R/T (Fresnel coefficients), X/Y/Z/UX.. (state columns),
# l (LG azimuthal index) are standard symbols in the optics literature.
ignore = ["N806", "N803", "E741"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
